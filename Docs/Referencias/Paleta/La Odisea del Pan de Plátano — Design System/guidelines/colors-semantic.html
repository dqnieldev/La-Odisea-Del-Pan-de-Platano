<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.chip{height:72px;border-radius:var(--radius-md);border:var(--border-w) solid var(--border-strong)}.n{font:600 13px/1.2 var(--font-body);color:var(--text-strong)}.v{font:400 11px/1.2 ui-monospace,monospace;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">Éxito</div><div class="v">Manglar · ingredientes, aliados</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">Peligro</div><div class="v">Chile #C8432B · vidas, daño</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="n">Aviso</div><div class="v">Plátano 600</div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="n">Info</div><div class="v">Mar #2F8FA0 · agua, pistas</div></div><div class="sw"><div class="chip" style="background:var(--disabled-bg)"></div><div class="n">Deshabilitado</div><div class="v">Beige + texto Café 500</div></div></div></body></html>
