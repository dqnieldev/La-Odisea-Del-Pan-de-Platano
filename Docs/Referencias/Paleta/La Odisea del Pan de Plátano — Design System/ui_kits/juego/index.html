<!DOCTYPE html><html><head><meta charset="utf-8"><title>La Odisea del Pan de Plátano — Juego</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;background:var(--cafe-950);overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden}</style></head><body><div id="stage"><div id="root"></div></div>
<script>function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}addEventListener('resize',fit);fit();</script>
<script type="text/babel" src="Menu.jsx"></script>
<script type="text/babel" src="WorldMap.jsx"></script>
<script type="text/babel" src="Level.jsx"></script>
<script type="text/babel">
function App(){
  const [screen,setScreen]=React.useState(()=>localStorage.getItem('odisea-screen')||'menu');
  const [level,setLevel]=React.useState(()=>+localStorage.getItem('odisea-level')||1);
  React.useEffect(()=>{localStorage.setItem('odisea-screen',screen);localStorage.setItem('odisea-level',level)},[screen,level]);
  if(screen==='menu')return <MainMenu onPlay={()=>setScreen('map')}/>;
  if(screen==='map')return <WorldMap onBack={()=>setScreen('menu')} onPlay={l=>{setLevel(l);setScreen('level')}}/>;
  return <Level key={level} level={level} onExit={()=>setScreen('map')} onNext={()=>{if(level<3)setLevel(level+1);else setScreen('map')}}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
